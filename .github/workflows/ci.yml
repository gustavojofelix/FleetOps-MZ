name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,html,scss}"
        continue-on-error: true
      - name: Unit tests
        run: npm run test:ci
      - name: Production build
        run: npm run build
