<div class="toast-region" aria-live="polite" aria-atomic="false">
  @for (toast of toasts.toasts(); track toast.id) {
    <div class="toast" [class]="'toast toast--' + toast.tone" [attr.role]="toast.tone === 'error' ? 'alert' : 'status'">
      <app-icon class="toast__icon" [name]="icon(toast.tone)" [size]="18" />
      <div class="toast__text">
        <p class="toast__message">{{ toast.message }}</p>
        @if (toast.description) {
          <p class="toast__description">{{ toast.description }}</p>
        }
      </div>
      <button
        type="button"
        class="toast__close"
        [attr.aria-label]="'common.actions.close' | t"
        (click)="toasts.dismiss(toast.id)"
      >
        <app-icon name="x" [size]="16" />
      </button>
    </div>
  }
</div>
